version: 2
project_name: pipolinkcheck

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    binary: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

archives:
  - format: binary

checksum:
  name_template: 'checksums.txt'

changelog:
  use: git
  format: "{{ .Message }}"

release:
  github:
    owner: jlettori
    name: pipolinkcheck
